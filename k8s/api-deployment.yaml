apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: __DOCKER_USERNAME__/mc-sv-list-api:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: AUTOMATIC_VERIFICATION_CRON
              value: "0 */15 * * *"
            - name: AUTOMATIC_SERVER_TIMEOUT_CRON
              value: "0 */5 * * *"
            - name: APP_PORT
              value: "3000"
            - name: DB_DATABASE
              value: "mc-list"
            - name: DB_USERNAME
              value: "AdminUser"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mc-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_PORT
              value: "5432"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_HOST
              value: "redis-service"
          envFrom:
            - secretRef:
                name: mc-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  selector:
    app: api
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
