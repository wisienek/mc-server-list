name: Build and Deploy to VPS Kubernetes

on:
    pull_request:
        branches:
            - main
    workflow_dispatch:

jobs:
    build-and-push:
        name: Build & Push Docker Images
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build & Push Frontend Image
              run: |
                  TAG=$(git rev-parse --short HEAD)
                  docker build -t ${{ secrets.DOCKER_USERNAME }}/mc-sv-list-frontend:$TAG -t ${{ secrets.DOCKER_USERNAME }}/mc-sv-list-frontend:latest -f apps/front/Dockerfile .
                  docker push ${{ secrets.DOCKER_USERNAME }}/mc-sv-list-frontend:$TAG
                  docker push ${{ secrets.DOCKER_USERNAME }}/mc-sv-list-frontend:latest

            - name: Build & Push API Image
              run: |
                  TAG=$(git rev-parse --short HEAD)
                  docker build -t ${{ secrets.DOCKER_USERNAME }}/mc-sv-list-api:$TAG -t ${{ secrets.DOCKER_USERNAME }}/mc-sv-list-api:latest -f apps/server/Dockerfile .
                  docker push ${{ secrets.DOCKER_USERNAME }}/mc-sv-list-api:$TAG
                  docker push ${{ secrets.DOCKER_USERNAME }}/mc-sv-list-api:latest

    deploy:
        name: Deploy to Kubernetes
        runs-on: ubuntu-latest
        needs: build-and-push
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Prepare templated k8s manifests
              run: |
                  mkdir -p k8s/generated
                  sed "s|__DOCKER_USERNAME__|${{ secrets.DOCKER_USERNAME }}|g" k8s/api-deployment.yaml > k8s/generated/api-deployment.yaml
                  sed "s|__DOCKER_USERNAME__|${{ secrets.DOCKER_USERNAME }}|g" k8s/frontend-deployment.yaml > k8s/generated/frontend-deployment.yaml
                  cp k8s/postgres-deployment.yaml k8s/generated/postgres-deployment.yaml
                  cp k8s/redis-deployment.yaml k8s/generated/redis-deployment.yaml
                  cp k8s/deploy.sh k8s/generated/deploy.sh

            - name: Sync Kubernetes files to VPS
              uses: appleboy/scp-action@v0.1.4
              with:
                  host: ${{ secrets.VPS_HOST }}
                  port: ${{ secrets.VPS_PORT }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  source: 'k8s/generated/*'
                  target: '/opt/k8s/'
                  strip_components: 1

            - name: SSH Deploy to Kubernetes
              uses: appleboy/ssh-action@v1.2.2
              with:
                  host: ${{ secrets.VPS_HOST }}
                  port: ${{ secrets.VPS_PORT }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  envs: COOKIE_SECRET,DISCORD_CLIENT_ID,DISCORD_CLIENT_SECRET,SITE_DOMAIN,DOCKER_USERNAME
                  script: |
                      if ! command -v kubectl &> /dev/null; then
                        curl -sfL https://get.k3s.io | sh -
                        sleep 20
                      fi

                      export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

                      chmod +x /opt/k8s/deploy.sh
                      /opt/k8s/deploy.sh
