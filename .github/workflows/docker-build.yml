name: Build and Push Docker Images

on:
    workflow_dispatch:

jobs:
    build-frontend:
        name: Build & Push Frontend
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build Frontend Image
              run: |
                  TAG=$(git rev-parse --short HEAD)
                  docker build -t ${{ secrets.DOCKER_USERNAME }}/mc-sv-list-frontend:$TAG -f apps/front/Dockerfile .

            - name: Push Frontend Image to Docker Hub
              run: |
                  docker push ${{ secrets.DOCKER_USERNAME }}/mc-sv-list-frontend:$TAG
                  docker push ${{ secrets.DOCKER_USERNAME }}/mc-sv-list-frontend:latest

    build-api:
        name: Build & Push API
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build API Image
              run: |
                  TAG=$(git rev-parse --short HEAD)
                  docker build -t ${{ secrets.DOCKER_USERNAME }}/mc-sv-list-api:$TAG -t ${{ secrets.DOCKER_USERNAME }}/mc-sv-list-api:latest -f apps/server/Dockerfile .

            - name: Push API Image to Docker Hub
              run: |
                  docker push ${{ secrets.DOCKER_USERNAME }}/mc-sv-list-api:$TAG
                  docker push ${{ secrets.DOCKER_USERNAME }}/mc-sv-list-api:latest
